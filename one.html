<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Happy Birthday bhondu 🥰❤️</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 320px;
        }

        h1 {
            color: #ff4d6d;
        }

        p {
            font-size: 18px;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
        }

        #yes {
            background: #ff4d6d;
            color: white;
        }

        #no {
            background: #ddd;
            position: absolute;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="card" id="card">
    <h1>🎂 Happy Birthday Ayushi 🎂</h1>
    <p>Do you know you are the most special person in my life? ❤️</p>
    <button id="yes" onclick="yesClicked()">YES 💖</button>
    <button id="no" onmouseover="moveNo()">NO 🙈</button>
</div>

<script>
    function yesClicked() {
        document.getElementById("card").innerHTML = `
            <h1>🥰 YAY! YAY!🥰</h1>
            <p>
                You make my world brighter every day 💕<br><br>
                I’m so lucky to have you ❤️<br><br>
                Happy Birthday, my bhondu, my love 🎉🎂
            </p>
        `;
    }

    function moveNo() {
        const noBtn = document.getElementById("no");
        const x = Math.random() * 250;
        const y = Math.random() * 250;
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }
</script>

</body>
</html>
